# Put this file on the VPS, replace the certificate paths, then reload Nginx.
# It makes HTTPS + www the only public storefront URL and prevents the
# non-www-to-www HTTP chain that produced intermittent 502 responses.

server {
    listen 80;
    server_name tosshop.ir www.tosshop.ir api.tosshop.ir;
    return 301 https://www.tosshop.ir$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tosshop.ir;
    ssl_certificate /etc/letsencrypt/live/tosshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosshop.ir/privkey.pem;
    return 301 https://www.tosshop.ir$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.tosshop.ir;
    ssl_certificate /etc/letsencrypt/live/tosshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosshop.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name api.tosshop.ir;
    ssl_certificate /etc/letsencrypt/live/tosshop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosshop.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
